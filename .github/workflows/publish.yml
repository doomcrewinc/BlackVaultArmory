name: Publish image

# Continuous delivery, not tagged releases. Every merge that lands on a
# publishing branch ships an image.
#
#   master   ->  :latest   + :<calver>-<sha7>
#   develop  ->  :develop  + :<calver>-<sha7>
#
# The immutable :<calver>-<sha7> is pushed by EVERY build, so any deploy can be
# pinned to an exact commit and rolled back to one. The floating tag is only an
# alias for "current" on that line.
#
# This replaces the tag-triggered release.yml, which never executed once: no
# tag was ever pushed to this repository. The branch/tag mapping now lives in
# scripts/ci/derive-image-tags.sh, which is executable and unit-tested
# (scripts/ci/derive-image-tags.test.ts) rather than being a `run:` block that
# only the real thing could exercise.
on:
  push:
    branches: [master, develop]

# DELIBERATELY NOT cancel-in-progress.
#
# The tags are written in one step, by the last job: it ties the amd64 and
# arm64 images, already pushed by digest, into one manifest list and points the
# tags at it. Cancelling a run part-way would leave ghcr.io holding untagged
# images that nothing references, and a newer run cancelling an older one in
# its last job could leave a floating tag behind the immutable one.
#
# Continuous publishing makes this MORE important than it was under tags, not
# less: two merges minutes apart are now routine, where two tag pushes minutes
# apart were not. The group is per-ref, so successive merges to the same branch
# QUEUE behind each other and each finishes its own push, while a develop build
# and a master build — which write disjoint floating tags — still run in
# parallel.
#
# Because runs queue, a run that hangs holds up every merge behind it. Each job
# below therefore has a time limit: a hung build fails and lets the next run
# start, instead of sitting for the six hours a job is otherwise allowed.
#
# Known and accepted: GitHub cancels a *pending* run when a newer one queues
# behind the same group, so a third merge landing while the first is still
# building can skip the middle commit's image. Nothing half-pushed is ever
# cancelled, `latest` always ends up on the newest build, and a skipped commit
# can be published by re-running its workflow run from the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Deny by default; each job below opts in to exactly what it needs.
permissions: {}

jobs:
  prepare:
    name: Derive the image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # contents: read is the minimum actions/checkout needs; without it the
      # checkout fails outright if this repository is ever made private.
      contents: read
    outputs:
      tags: ${{ steps.ver.outputs.tags }}
      full: ${{ steps.ver.outputs.full }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ${{ github.ref_name }} is NEVER interpolated into a shell script.
      #
      # An interpolated ref name is substituted into the script TEXT before
      # bash sees it, so a branch containing shell metacharacters executes as
      # code. The environment form below passes the value as data; bash never
      # parses it as syntax. This is the standard Actions script-injection hole
      # and the reason this step looks the way it does. Do not "simplify" it.
      #
      # The branch and sha reach the script as positional ARGUMENTS taken from
      # those environment variables, so the same property holds inside it.
      - name: Derive the image tags
        id: ver
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci/derive-image-tags.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      # The image name without a tag, for the pushes by digest: the first tag
      # line with its ":<tag>" removed.
      - name: Derive the image name
        id: image
        env:
          TAGS: ${{ steps.ver.outputs.tags }}
        run: |
          first="${TAGS%%$'\n'*}"
          echo "image=${first%:*}" >>"$GITHUB_OUTPUT"

  build:
    # Each architecture is built on a runner of that architecture. The arm64
    # image used to be built under QEMU emulation on an x86 runner, which was
    # most of a 16-23 minute publish and once hung for over two hours.
    name: Build the ${{ matrix.arch }} image
    needs: prepare
    strategy:
      # One image without the other is not publishable.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            cache: type=gha
            cache-to: type=gha,mode=max
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: type=gha,scope=arm64
            cache-to: type=gha,mode=max,scope=arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # The only write scope this job has, and the only one it needs.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, and this job holds a token that can
          # write packages. Keep it out of .git/config.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, with no tag: a single-architecture image must never
      # be what a tag points at. The tags are written by the manifest job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # The SAME string as the immutable tag's version portion, so the
          # version the Settings page and /api/health report is exactly the
          # tag you pulled. A user quoting a version in a bug report is
          # quoting an image that can be fetched.
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.full }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.cache }}
          cache-to: ${{ matrix.cache-to }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the build reported no image digest"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/digests"
          : >"$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Hand the digest to the manifest job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the multi-architecture tags
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Collect the two digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags come from the derive step, NOT from a list here, because
      # :latest must be reachable only from master. See that script for the
      # reasoning and its test file for the proof. They reach this script as
      # environment data, never as script text.
      - name: Create the manifest list and push the tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tag_args+=(-t "$tag"); fi
          done <<<"$TAGS"
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          if [[ "${#refs[@]}" -ne 2 ]]; then
            echo "::error::expected 2 image digests (amd64 and arm64), found ${#refs[@]}"
            exit 1
          fi
          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "::error::no tags to push"
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${TAGS%%$'\n'*}"
