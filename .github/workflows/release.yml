name: Release

on:
  push:
    tags: ["v[0-9]*"]

# DELIBERATELY NOT cancel-in-progress.
#
# This job pushes a multi-architecture manifest: the amd64 image, the arm64
# image, and then the manifest list that ties them together. Cancelling
# between those steps leaves ghcr.io holding blobs that no manifest references
# — or worse, a `latest` tag pointing at a half-written list. A superseded
# release run must be allowed to finish.
#
# The group still serialises: two tags pushed close together queue instead of
# racing each other to overwrite `latest`.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Deny by default; the one job below opts in to exactly what it needs.
permissions: {}

jobs:
  publish:
    name: Build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the tagged tree
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, and this job holds a token that can
          # write packages. Keep it out of .git/config.
          persist-credentials: false

      # ${{ github.ref_name }} is NEVER interpolated into a shell script.
      #
      # An interpolated ref name is substituted into the script TEXT before
      # bash sees it, so a tag containing shell metacharacters executes as
      # code with this job's packages:write token. The environment form below
      # passes the value as data; bash never parses it as syntax. This is the
      # standard Actions script-injection hole and the reason this step looks
      # the way it does. Do not "simplify" it.
      - name: Derive version strings
        id: ver
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CALVER="${TAG%%-*}"
          SHA="$(git rev-parse --short=7 HEAD | cut -c1-7)"
          echo "calver=$CALVER" >> "$GITHUB_OUTPUT"
          echo "full=$CALVER-$SHA"  >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.full }}
          tags: |
            ghcr.io/doomcrewinc/blackvaultarmory:${{ steps.ver.outputs.full }}
            ghcr.io/doomcrewinc/blackvaultarmory:${{ steps.ver.outputs.calver }}
            ghcr.io/doomcrewinc/blackvaultarmory:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
