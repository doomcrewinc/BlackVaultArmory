# Development compose — builds image from local source, PostgreSQL.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:17-alpine
    container_name: blackvault-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blackvault
      POSTGRES_DB: blackvault
      POSTGRES_PASSWORD: devpass
    volumes:
      - blackvault-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackvault -d blackvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  blackvault:
    build: .
    container_name: blackvault-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=postgres
      - DATABASE_URL=postgresql://blackvault:devpass@db:5432/blackvault
      - PUBLIC_URL=${BLACKVAULT_PUBLIC_URL:-http://localhost:3000}
      - ALLOW_DIRECT_ACCESS=${BLACKVAULT_ALLOW_DIRECT_ACCESS:-true}
      # Field encryption: secrets/blackvault_encryption_key (below), or this.
      - BLACKVAULT_ENCRYPTION_KEY=${BLACKVAULT_ENCRYPTION_KEY:-}
    volumes:
      - blackvault-dev-data:/app/data
      - blackvault-dev-uploads:/app/uploads
      # Same key wiring as docker-compose.yml (see the comment there).
      - type: bind
        source: ./secrets
        target: /run/blackvault-secrets
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      # In memory only; no setuid, devices or executables on it.
      - /run/secrets:rw,noexec,nosuid,nodev,size=1m,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  blackvault-dev-postgres:
  blackvault-dev-data:
  blackvault-dev-uploads:
