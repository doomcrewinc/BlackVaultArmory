# Development compose — builds image from local source, PostgreSQL.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:17-alpine
    container_name: blackvault-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blackvault
      POSTGRES_DB: blackvault
      POSTGRES_PASSWORD: devpass
    volumes:
      - blackvault-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackvault -d blackvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  blackvault:
    build: .
    container_name: blackvault-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=postgres
      - DATABASE_URL=postgresql://blackvault:devpass@db:5432/blackvault
    volumes:
      - blackvault-dev-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  blackvault-dev-postgres:
  blackvault-dev-uploads:
