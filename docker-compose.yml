# BlackVault — Production compose (amd64 + arm64). The ONLY production compose file.
#
# First time: run ./install.sh (Mac/Linux) or install.bat (Windows)
# Updates:    run ./update.sh  (Mac/Linux) or update.bat  (Windows)
# Manual run: docker compose up -d        (always plain `docker compose`, no -f)
#
# Which database runs is decided by .env, not by picking a file:
#
#   SQLite     .env has none of the four lines below (or DB_PROVIDER=sqlite).
#              Only the BlackVault container starts; the database is the single
#              file ${DATA_DIR}/db/vault.db. This is what every install made before
#              PostgreSQL support has, so a plain `docker compose up -d` keeps them
#              working exactly as before, with no changes to .env.
#
#   PostgreSQL .env has all four of these (install.sh writes them for new installs):
#                COMPOSE_PROFILES=postgres      <- turns on the "db" service below
#                DB_PROVIDER=postgres
#                POSTGRES_PASSWORD=<48 hex characters>
#                DATABASE_URL=postgresql://blackvault:<same password>@db:5432/blackvault
#              The database container starts first, and BlackVault waits for it.
#
# Moving from SQLite to PostgreSQL: see "Moving from SQLite to PostgreSQL" in README.md.
# The migration tool switches .env for you once the copy is verified.
#
# Maintainers: never use ${VAR:?message} in this file. Compose evaluates it even for
# services whose profile is off, so it would break the SQLite default. An empty
# POSTGRES_PASSWORD with the profile on makes the postgres container refuse to start,
# which is loud and safe.
#
# Docker Compose reads .env automatically — no --env-file flag needed.
# For local development, use docker-compose.dev.yml instead.

services:
  db:
    image: postgres:17-alpine
    container_name: blackvault-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: blackvault
      POSTGRES_DB: blackvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackvault -d blackvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  blackvault:
    build: .
    container_name: blackvault
    restart: unless-stopped
    depends_on:
      # required: false — on SQLite the db service is not enabled, and the app
      # starts on its own. On PostgreSQL it waits for the database healthcheck.
      db:
        condition: service_healthy
        required: false
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/vault.db?connection_limit=1}
      # Only needed to read legacy enc: serial numbers; new data is plain text.
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
    volumes:
      # /app/data holds vault.db on SQLite, server-side backups on both, and the
      # .migrated record the migration tool writes. Without this mount, backups
      # saved under /app/data/backups vanish when the container is recreated.
      - ${DATA_DIR:-./data}/db:/app/data
      - ${DATA_DIR:-./data}/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
