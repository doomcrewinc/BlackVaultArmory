# BlackVault — Production compose, SQLite fallback (amd64 + arm64)
#
# Single container, no database server. PostgreSQL (docker-compose.yml) is the
# recommended default; use this file if you prefer a single SQLite file.
#
#   docker compose -f docker-compose.sqlite.yml up -d
#
# Moving to PostgreSQL later: see "Moving from SQLite to PostgreSQL" in README.md.
# Docker Compose reads .env automatically — no --env-file flag needed.

services:
  blackvault:
    build: .
    container_name: blackvault
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=sqlite
      - DATABASE_URL=file:/app/data/vault.db?connection_limit=1
    volumes:
      - ${DATA_DIR:-./data}/db:/app/data
      - ${DATA_DIR:-./data}/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
