# Temporary overlay for the one-time SQLite -> PostgreSQL migration.
# Publishes the database on 127.0.0.1:55432 (this machine only) so
# `npm run migrate:to-postgres` can reach it. Use it ONLY during the
# migration — see "Moving from SQLite to PostgreSQL" in README.md:
#
#   docker compose -f docker-compose.yml -f docker-compose.migrate.yml up -d --wait db
#
# Naming the db service starts it even though .env has no COMPOSE_PROFILES
# yet (the app keeps running on SQLite until the copy is verified). It needs
# BLACKVAULT_POSTGRES_PASSWORD in .env. The migrator recognises this port as the stack's
# own database, and only then switches .env.
#
# Running plain `docker compose up -d` afterwards recreates the database
# container without the published port.

services:
  db:
    ports:
      - "127.0.0.1:55432:5432"
